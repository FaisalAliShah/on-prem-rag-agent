services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      VECTOR_BACKEND: ${VECTOR_BACKEND:-faiss}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-1024}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-256}
      WARMUP_ON_STARTUP: ${WARMUP_ON_STARTUP:-1}
      WARMUP_OLLAMA: ${WARMUP_OLLAMA:-1}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      HF_HOME: ${HF_HOME:-/root/.cache/huggingface}
      HF_HUB_CACHE: ${HF_HUB_CACHE:-/root/.cache/huggingface/hub}
      SENTENCE_TRANSFORMERS_HOME: ${SENTENCE_TRANSFORMERS_HOME:-/root/.cache/huggingface}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./DOCUMENTS_INGESTED.md:/app/DOCUMENTS_INGESTED.md
      - hf_cache:/root/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: rag_ui
    ports:
      - "8501:8501"
    environment:
      RAG_API_URL: http://app:8000
      RAW_DATA_DIR: /app/data/raw
      UI_REQUEST_TIMEOUT: ${UI_REQUEST_TIMEOUT:-240}
    volumes:
      - ./data:/app/data
      - ./ui:/app/ui
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:latest
    container_name: ollama_model_pull
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_MODEL}\""]
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    profiles:
      - qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
  hf_cache:
